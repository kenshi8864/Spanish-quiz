const getJSON=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let favorites=getJSON('esQuizPlusFavorites',[]),history=getJSON('esQuizPlusHistory',[]);
function init(){const cats=[...new Set(WORDS.map(w=>w.cat))];$('category').innerHTML='<option value="all">すべて（'+WORDS.length+'語）</option>'+cats.map(c=>`<option value="${c}">${c}（${WORDS.filter(w=>w.cat===c).length}語）</option>`).join('');document.querySelectorAll('#counts button').forEach(b=>b.onclick=()=>{state.count=b.dataset.n;document.querySelectorAll('#counts button').forEach(x=>x.classList.toggle('on',x===b))});updateCounts()}
function screens(id){['home','quiz','result','list'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}function goHome(){updateCounts();screens('home')}
function setDir(d){state.dir=d;$('dir1').classList.toggle('on',d==='en-es');$('dir2').classList.toggle('on',d==='es-en')}
function setMode(m){state.mode=m;$('mode1').classList.toggle('on',m==='choice');$('mode2').classList.toggle('on',m==='typing')}
function updateCounts(){$('favCount').textContent=favorites.length+'語';$('histCount').textContent=history.length+'件'}
function startQuiz(pool){pool=pool||($('category').value==='all'?WORDS:WORDS.filter(w=>w.cat===$('category').value));if(!pool.length)return;state.lastPool=[...pool];let n=state.count==='all'?pool.length:Math.min(+state.count,pool.length);state.questions=shuffle(pool).slice(0,n);state.index=0;state.results=[];renderQuestion();screens('quiz')}
function current(){return state.questions[state.index]}function promptOf(w){return state.dir==='en-es'?w.en:w.es}function answerOf(w){return state.dir==='en-es'?w.es:w.en}
function renderQuestion(){state.answered=false;let w=current(),ans=answerOf(w);$('qnum').textContent=(state.index+1)+' / '+state.questions.length;$('liveScore').textContent='🔥 '+state.results.filter(r=>r.correct).length;$('bar').style.width=(state.index/state.questions.length*100)+'%';$('qcat').textContent=w.cat;$('instruction').textContent=state.dir==='en-es'?'英語をスペイン語に':'スペイン語を英語に';$('prompt').textContent=promptOf(w);$('starBtn').textContent=favorites.includes(w.id)?'★':'☆';$('promptSpeak').classList.toggle('hidden',state.dir!=='es-en');$('feedback').classList.add('hidden');$('nextBtn').classList.add('hidden');$('speakAnswer').classList.add('hidden');let area=$('answerArea');area.innerHTML='';if(state.mode==='choice'){let field=state.dir==='en-es'?'es':'en';let wrong=shuffle(WORDS.filter(x=>x.id!==w.id)).map(x=>x[field]).filter((v,i,a)=>v!==ans&&a.indexOf(v)===i).slice(0,3);shuffle([ans,...wrong]).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>answerChoice(v,b);area.appendChild(b)})}else{area.innerHTML='<input id="typed" autocomplete="off" placeholder="答えを入力"><button class="btn dark" onclick="answerTyped()">回答する</button>';setTimeout(()=>$('typed')?.focus(),50)}}
function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function record(answer,correct){let w=current();state.results.push({...w,answer,correct,expected:answerOf(w)});state.answered=true;$('feedback').textContent=correct?'正解！':'正解：'+answerOf(w);$('feedback').classList.remove('hidden');$('nextBtn').classList.remove('hidden');if(state.dir==='en-es')$('speakAnswer').classList.remove('hidden');$('bar').style.width=((state.index+1)/state.questions.length*100)+'%'}
function answerChoice(v,b){if(state.answered)return;let ans=answerOf(current()),ok=v===ans;[...$('answerArea').children].forEach(x=>{x.disabled=true;if(x.textContent===ans)x.classList.add('good')});if(!ok)b.classList.add('bad');record(v,ok)}
function answerTyped(){if(state.answered)return;let v=$('typed').value;if(!v.trim())return;let accepted=answerOf(current()).split('/').map(norm);record(v,accepted.includes(norm(v)));$('typed').disabled=true}
function nextQuestion(){if(state.index+1>=state.questions.length){finish();return}state.index++;renderQuestion()}
function finish(){let good=state.results.filter(r=>r.correct).length,total=state.questions.length,score=Math.round(good/total*100);history.unshift({id:Date.now(),date:new Date().toLocaleString('ja-JP'),good,total,score,dir:state.dir,mode:state.mode});history=history.slice(0,30);save('esQuizPlusHistory',history);$('score').textContent=score+'%';$('summary').innerHTML=`<span class="pill">正解 ${good}</span>　<span class="pill" style="background:#fff1f2;color:#be123c">不正解 ${total-good}</span>`;let wrong=state.results.filter(r=>!r.correct);$('retryWrong').classList.toggle('hidden',!wrong.length);$('retryWrong').textContent=`間違えた${wrong.length}問だけ再テスト`;$('review').innerHTML='<h3>復習する単語</h3>'+(wrong.length?wrong.map(wordHTML).join(''):'全問正解です！');screens('result')}
function wordHTML(w){return `<div class="word row"><div><b>${w.en}</b><span class="es">${w.es}</span>${w.answer!==undefined?`<div class="small">回答: ${w.answer}</div>`:''}</div><div><button class="btn mini speak" onclick="speak('${w.es.replaceAll("'","\\'")}')">🔊</button> <button class="btn mini speak" onclick="toggleFav('${w.id}')">${favorites.includes(w.id)?'★':'☆'}</button></div></div>`}
function retryWrongOnly(){let ids=state.results.filter(r=>!r.correct).map(r=>r.id);startQuiz(WORDS.filter(w=>ids.includes(w.id)))}function restartSame(){startQuiz(state.lastPool)}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('esQuizPlusFavorites',favorites);updateCounts();if(!$('list').classList.contains('hidden'))showFavorites()}
function toggleCurrentFav(){toggleFav(current().id);$('starBtn').textContent=favorites.includes(current().id)?'★':'☆'}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.88;speechSynthesis.speak(u)}function speakCurrent(){speak(current().es)}
function showFavorites(){$('listTitle').textContent='お気に入り';let a=WORDS.filter(w=>favorites.includes(w.id));$('listBody').innerHTML=a.length?'<button class="btn dark" onclick="startQuiz(WORDS.filter(w=>favorites.includes(w.id)))">お気に入りをテスト</button><div class="card">'+a.map(wordHTML).join('')+'</div>':'<div class="card">まだお気に入りがありません。</div>';screens('list')}
function showAllWords(){$('listTitle').textContent='単語一覧';$('listBody').innerHTML='<div class="card">'+WORDS.map(wordHTML).join('')+'</div>';screens('list')}
function showHistory(){$('listTitle').textContent='学習履歴';$('listBody').innerHTML=history.length?'<div class="card">'+history.map(h=>`<div class="word row"><div><b>${h.date}</b><div class="small">${h.dir==='en-es'?'英語 → スペイン語':'スペイン語 → 英語'} ・ ${h.mode==='choice'?'4択':'入力'}</div></div><div><b style="color:var(--rose);font-size:24px">${h.score}%</b><div class="small">${h.good}/${h.total}</div></div></div>`).join('')+'</div>':'<div class="card">まだ履歴がありません。</div>';screens('list')}
init();
</script></body></html>
